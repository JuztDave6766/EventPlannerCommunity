{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-card rounded-2xl shadow-soft p-6 border border-border">
  <h1 class="font-serif text-3xl text-primary mb-4">Login</h1>
  <form method="post" action="{{ url_for('login') }}" class="space-y-4">
    <div>
      <label class="text-sm font-medium">👤 Nome utente</label>
      <input type="text" name="username" required class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
    </div>
    <div>
      <label class="text-sm font-medium">🔒 Password</label>
      <input type="password" name="password" required class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
    </div>
    <button type="submit" class="w-full px-6 py-3 rounded-full bg-primary text-white font-medium shadow-soft hover:bg-primary/90 transition">Entra</button>
  </form>
  <p class="mt-4 text-sm text-muted-foreground">Non hai un account? <a href="{{ url_for('register') }}" class="text-primary font-medium">Registrati</a></p>
</div>
{% endblock %}
