{% extends "base.html" %}
{% block content %}
<section class="mb-6">
  <h1 class="font-serif text-4xl text-primary mb-2">Modifica Modello</h1>
  <p class="text-muted-foreground">Aggiorna i dettagli del tuo modello.</p>
</section>

<form method="post" action="{{ url_for('edit', model_id=model.id_modello) }}" class="bg-card rounded-2xl shadow-soft p-6 border border-border space-y-4">
  <div>
    <label class="text-sm font-medium">📝 Titolo Breve</label>
    <input type="text" name="titolo" value="{{ (data or {}).get('titolo','') }}" required
      class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="text-sm font-medium">📅 Tipo Evento</label>
      <select name="tipo_evento" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
        {% for o in event_options %}
          <option value="{{ o }}" {% if (data or {}).get('tipo_evento','Any')==o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-sm font-medium">👤 Partecipanti</label>
      <select name="partecipanti" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
        {% for o in attendees_options %}
          <option value="{{ o }}" {% if (data or {}).get('partecipanti','Any')==o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="text-sm font-medium">👥 N° Persone</label>
      <select name="num_persone" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
        {% for o in people_options %}
          <option value="{{ o }}" {% if (data or {}).get('num_persone', people_options[0])==o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-sm font-medium">💰 Range Costo</label>
      <select name="range_costo" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">
        {% for o in cost_options %}
          <option value="{{ o }}" {% if (data or {}).get('range_costo','Any')==o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div>
    <label class="text-sm font-medium">🏡 Logistica Cibo/Location</label>
    <textarea name="logistica_cibo" rows="4" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">{{ (data or {}).get('logistica_cibo','') }}</textarea>
  </div>

  <div>
    <label class="text-sm font-medium">🕹️ Descrizione Attività</label>
    <textarea name="desc_attivita" rows="6" class="w-full rounded-lg border border-border px-3 py-2 focus:ring-2 focus:ring-primary/40 focus:outline-none">{{ (data or {}).get('desc_attivita','') }}</textarea>
  </div>

  <div class="flex gap-3">
    <button type="submit" class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-primary text-white font-medium shadow-soft hover:bg-primary/90 transition">
      💾 Salva modifiche
    </button>
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 px-6 py-3 rounded-full border border-border font-medium hover:bg-muted transition">
      Annulla
    </a>
  </div>
</form>
{% endblock %}
