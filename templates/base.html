<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>EventPlannerCommunity</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; max-width: 920px; margin: 20px auto; padding: 0 12px; }
    nav { margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 10px 0; background: #f9f9f9; }
    .btn { padding: 6px 10px; margin: 2px; border: 1px solid #999; border-radius: 4px; background: #eee; cursor: pointer; text-decoration: none; color: #000; display: inline-block; }
    .btn-primary { background: #007bff; color: #fff; border-color: #007bff; }
    .btn-danger { background: #dc3545; color: #fff; border-color: #dc3545; }
    label { font-weight: bold; display: block; margin-top: 8px; }
    input, textarea, select { width: 100%; padding: 6px; margin: 4px 0 10px; box-sizing: border-box; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    ul.flash { color: #333; background: #fff3cd; padding: 8px 12px; border: 1px solid #ffeeba; border-radius: 4px; list-style: none; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Cerca</a> |
    <a href="{{ url_for('create') }}">Crea</a> |
    {% if session.get('user') %}
      Utente: <strong>{{ session['user'] }}</strong> | <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flash">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
