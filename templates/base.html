<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPlannerCommunity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E11D48',
            secondary: '#FB7185',
            accent: '#2563EB',
            background: '#FFF1F2',
            foreground: '#881337',
            card: '#FFFFFF',
            muted: '#F0ECF2',
            'muted-foreground': '#475569',
            border: '#FECDD3',
            destructive: '#DC2626',
          },
          fontFamily: {
            sans: ['Inter','sans-serif'],
            serif: ['Playfair Display','serif'],
          },
          boxShadow: {
            soft: '0 4px 20px -4px rgba(225,29,72,0.15)',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen">
  <header class="sticky top-0 z-40 backdrop-blur bg-white/80 border-b border-border">
    <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <a href="{{ url_for('index') }}" class="font-serif text-2xl font-semibold text-primary">EventPlanner</a>
      <div class="flex flex-wrap items-center gap-2 text-sm">
        <a href="{{ url_for('index') }}" class="px-3 py-1.5 rounded-full hover:bg-muted transition">Cerca</a>
        <a href="{{ url_for('create') }}" class="px-3 py-1.5 rounded-full hover:bg-muted transition">Crea</a>
        <a href="{{ url_for('chart') }}" class="px-3 py-1.5 rounded-full hover:bg-muted transition">Grafico</a>
      </div>
      <div class="ml-auto flex items-center gap-2 text-sm">
        {% if session.get('user') %}
          <span class="px-3 py-1.5 rounded-full bg-muted text-muted-foreground">👤 {{ session['user'] }}</span>
          <a href="{{ url_for('logout') }}" class="px-3 py-1.5 rounded-full border border-border hover:bg-muted transition">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}" class="px-3 py-1.5 rounded-full bg-primary text-white hover:bg-primary/90 transition">Login</a>
          <a href="{{ url_for('register') }}" class="px-3 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/10 transition">Registrati</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for m in messages %}
            <div class="px-4 py-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 text-sm">{{ m }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
